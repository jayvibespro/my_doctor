name: my_doctor
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.5
  provider: ^6.0.5
  flutter_svg: ^2.0.5
  get_it: ^7.2.0
  injectable: ^1.5.3
  heroicons: ^0.9.0
  pinput: ^3.0.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  http: ^1.1.2
  country_code_picker: ^3.0.0
  url_launcher: ^6.2.2
  connectivity_plus: ^6.1.0
  path_provider:
  json_annotation: ^4.8.1
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.0.7
  path: ^1.8.0
  image: ^4.1.6
  top_snackbar_flutter: ^3.1.0
  form_builder_validators:
  flutter_form_builder:
  dropdown_textfield: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  injectable_generator: ^1.5.3
  hive_generator: 2.0.0
  json_serializable: ^6.2.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: mark_pro
      fonts:
        - asset: assets/fonts/mark_pro_bold.ttf
          weight: 700
        - asset: assets/fonts/mark_pro_heavy.ttf
          weight: 800
        - asset: assets/fonts/mark_pro_medium.ttf
          weight: 600
        - asset: assets/fonts/mark_pro_normal.ttf
          weight: 400
